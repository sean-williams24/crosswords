[functions.app-store-notifications]
# Apple cannot attach a Supabase bearer token. The URL is protected by the
# independently configured APPLE_NOTIFICATION_WEBHOOK_SECRET and every payload
# is reconciled with the App Store Server API before an entitlement changes.
verify_jwt = false

[functions.delete-account]
# Browser CORS preflight requests cannot contain a bearer token. The handler
# permits that OPTIONS request, then verifies the bearer token itself before
# it makes any account changes.
verify_jwt = false

[functions.stripe-webhook]
# Stripe authenticates each raw-body delivery with STRIPE_WEBHOOK_SECRET.
verify_jwt = false

[functions.create-stripe-checkout]
# Browser CORS preflight has no bearer token; the handler verifies the user on
# every non-OPTIONS request with Supabase Auth before creating Checkout.
verify_jwt = false

[functions.create-stripe-portal]
# The portal function performs the same per-request Supabase Auth verification.
verify_jwt = false
