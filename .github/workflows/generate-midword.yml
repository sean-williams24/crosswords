name: Generate Midword Puzzles

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

concurrency:
  group: midword-publishing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r Backend/requirements.txt
      - name: Test selection and inventory
        run: python -m unittest discover -s Backend -p test_generate_midword.py
      - name: Fill today and the next three weeks
        id: publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -o pipefail
          python Backend/generate_midword.py --target-days 21 | tee "$RUNNER_TEMP/midword-report.json"
          echo "remaining=$(jq -r '.remaining' "$RUNNER_TEMP/midword-report.json")" >> "$GITHUB_OUTPUT"
      - name: Report low approved inventory
        if: steps.publish.outputs.remaining != '' && fromJSON(steps.publish.outputs.remaining) < 21
        uses: actions/github-script@v7
        with:
          script: |
            const remaining = ${{ steps.publish.outputs.remaining }};
            const title = 'Midword approved inventory running low';
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            if (!issues.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body: `${remaining} approved puzzles remain. Curate more compound pairs in Backend/midword_approved.json before the weekly publisher runs out.`});
            }
      - name: Report generation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Midword generation failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = issues.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Midword publishing failed again: ${run}`});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `The Midword inventory or publishing job needs attention: ${run}`});
            }
