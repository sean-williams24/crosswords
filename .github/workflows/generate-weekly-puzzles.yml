name: Generate Weekly Crossword Puzzles

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r Backend/requirements.txt

      - name: Check weekly schedule and determine next params
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date
          import os
          import sys

          from supabase import create_client

          sys.path.insert(0, "Backend")
          from generate_weekly_puzzle import current_release_sunday, plan_weekly_generation

          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          rows = sb.table("weekly_puzzles").select("date,puzzle_number").order("puzzle_number").execute().data
          release_sunday = current_release_sunday(date.today())
          plan = plan_weekly_generation(rows, release_sunday=release_sunday)

          print(f"Future weekly puzzles: {plan.future_count}", file=sys.stderr)
          if plan.count == 0:
              print("enough=true")
              print(f"future_count={plan.future_count}")
          else:
              print("enough=false")
              print(f"future_count={plan.future_count}")
              print(f"generation_reason={plan.reason}")
              print(f"generation_count={plan.count}")
              print(f"next_date={plan.start.puzzle_date.isoformat()}")
              print(f"next_number={plan.start.puzzle_number}")
          PY

      - name: Skip if enough puzzles remain
        if: steps.check.outputs.enough == 'true'
        run: echo "Skipping — ${{ steps.check.outputs.future_count }} future weekly puzzles are queued without gaps."

      - name: Fetch recently-used words
        if: steps.check.outputs.enough == 'false'
        id: used_words
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 -c "
          from supabase import create_client
          import json, os
          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])
          used = set()
          # Weekly puzzles only — last 13 weeks
          # Daily puzzle words are intentionally excluded from this check: daily and weekly
          # are separate products and cross-excluding daily words depletes the short-word bank,
          # making the 13x13 solver fail to find valid fills.
          weekly = sb.table('weekly_puzzles').select('clues').order('date', desc=True).limit(13).execute()
          for row in weekly.data:
              for clue in row.get('clues', []):
                  ans = clue.get('answer', '')
                  if ans:
                      used.add(ans.upper())
          with open('/tmp/used_words.json', 'w') as f:
              json.dump(sorted(used), f)
          print(f'Fetched {len(used)} recently-used words from last 13 weekly puzzles')
          "

      - name: Generate and upload required weekly puzzles
        if: steps.check.outputs.enough == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "${{ steps.check.outputs.generation_reason }} — generating ${{ steps.check.outputs.generation_count }} puzzle(s) from ${{ steps.check.outputs.next_date }} (#${{ steps.check.outputs.next_number }})"
          python3 Backend/generate_weekly_puzzle.py \
            --date "${{ steps.check.outputs.next_date }}" \
            --start-number "${{ steps.check.outputs.next_number }}" \
            --count "${{ steps.check.outputs.generation_count }}" \
            --max-runtime-seconds 20700 \
            --output generated_weekly_puzzles \
            --exclude-words /tmp/used_words.json

      - name: Upload generated weekly puzzle JSON artifact
        if: ${{ always() && steps.check.outputs.enough == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-crossword-json-${{ steps.check.outputs.next_date }}
          path: generated_weekly_puzzles/*.json
          if-no-files-found: ignore
