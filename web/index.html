<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free daily word games to challenge your mind. Play Backword, Midword, Anagram, and Quick Crossword on Intervls, with a weekly Pro Crossword and Word of the Day."
    />
    <title>Intervls — Free daily word games</title>
    <meta name="robots" content="__INTERVLS_ROBOTS__" />
    <link rel="canonical" href="https://intervls.com/" />
    <link rel="icon" type="image/png" sizes="1024x1024" href="/brand/intervls-tab-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="Intervls" />
    <meta property="og:title" content="Intervls — Free daily word games to challenge your mind" />
    <meta property="og:description" content="Free daily word games to challenge your mind. Play Backword, Midword, Anagram, and Quick Crossword on Intervls, with a weekly Pro Crossword and Word of the Day." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://intervls.com/" />
    <meta property="og:image" content="https://intervls.com/brand/intervls-social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        const key = "backword:web:theme:v1";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch {}
        const resolved = preference === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
